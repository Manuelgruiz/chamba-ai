version: '3.8'
services:
  redis:
    image: redis:7-alpine
    container_name: chamba_redis
    ports:
      - "6379:6379"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: chamba_postgres
    environment:
      POSTGRES_USER: chamba_user
      POSTGRES_PASSWORD: chamba_password
      POSTGRES_DB: chamba_db
    ports:
      - "5432:5432"
